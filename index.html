<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOTODO</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand-wrap">
        <p class="brand">GOTODO</p>
        <p class="tagline">FOR THE WORKING DAY</p>
      </div>
      <div class="top-actions">
        <p class="today-remain" id="today-remain"></p>
        <button type="button" class="btn-today" id="jump-today">오늘</button>
      </div>
    </header>

    <main class="layout">
      <section class="calendar-panel" aria-label="월간 캘린더">
        <div class="month-nav">
          <button type="button" class="nav-btn" id="prev-month" aria-label="이전 달">
            ‹
          </button>
          <h1 class="month-title" id="month-title"></h1>
          <button type="button" class="nav-btn" id="next-month" aria-label="다음 달">
            ›
          </button>
        </div>
        <div class="weekday-row" id="weekday-row"></div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </section>

      <section class="task-panel" aria-label="할 일">
        <div class="task-header">
          <p class="eyebrow" id="selected-label">TODAY</p>
          <h2 class="selected-date" id="selected-date"></h2>
          <p class="count" id="task-count"></p>
        </div>

        <form class="add-form" id="add-form">
          <label class="sr-only" for="task-title">할 일 제목</label>
          <input
            id="task-title"
            name="title"
            type="text"
            maxlength="80"
            placeholder="할 일을 입력하세요"
            autocomplete="off"
            required
          />
          <label class="sr-only" for="task-priority">우선순위</label>
          <select id="task-priority" name="priority">
            <option value="normal">보통</option>
            <option value="urgent">긴급</option>
          </select>
          <button type="submit" class="btn-add">추가</button>
        </form>

        <ul class="task-list" id="task-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
